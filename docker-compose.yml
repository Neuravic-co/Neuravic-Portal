# Run the portal with: docker compose up -d --build
# Put it behind a reverse proxy that terminates HTTPS; the session cookie is Secure-only in production.
services:
  portal:
    build: .
    ports:
      - "127.0.0.1:5174:5174"
    env_file:
      - path: .env
        required: false
    environment:
      PORTAL_DB_PATH: /data/portal.db
    volumes:
      - portal-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  portal-data:
