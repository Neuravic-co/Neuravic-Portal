name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit and database tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  e2e:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Start the production server
        env:
          PORTAL_DB_PATH: ${{ runner.temp }}/portal-ci.db
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5174/api/health && break
            sleep 1
          done
      - run: npm run smoke
      - name: Server log
        if: failure()
        run: cat server.log

  browser:
    name: Browser tests (sign-up and sign-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mailpit is a test mail server: the portal sends its confirmation and reset emails to it, and the tests read them
    # back from its API (port 8025).
    services:
      mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      MAIL_FROM: Neuravic Portal <no-reply@neuravic.test>
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=moderate

  security:
    name: Secret and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Secret scanning reads the whole git history, not just the latest files.
          fetch-depth: 0
      - name: Scan for leaked secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown
      - name: Scan dependencies, secrets and Docker/CI configuration (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker:
    name: Docker image builds and passes its health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static, test, e2e, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: neuravic-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and wait until it is healthy
        run: |
          docker run -d --name portal -p 5174:5174 neuravic-portal:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portal)" = healthy ] && exit 0
            sleep 2
          done
          docker logs portal
          exit 1
      - name: Smoke test the container
        run: node scripts/smoke.mjs http://127.0.0.1:5174
